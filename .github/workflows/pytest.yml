name: AI Red Team Audit Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then python -m pip install -r requirements.txt; fi
        python -m pip install "pydantic>=2,<3" pytest fastapi uvicorn

    - name: Run Pytest
      run: python -m pytest -v

    - name: Ensure audit log exists
      run: |
        if [ ! -f audit_log.json ]; then echo '{"results":[]}' > audit_log.json; fi

    - name: Run Audit Scorer     run:python3servicesaudit_scorer.py\audit_log.json
