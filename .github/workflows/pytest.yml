name: AI Red Team Audit Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install "pydantic>=2,<3" pytest fastapi uvicorn

    - name: Run Pytest
      run: python -m pytest -v

    - name: Run Audit Scorer
      run: python3 services/audit_scorer.py audit_log.json
